name: API contract

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, fixed_bugs]

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate checked-in OpenAPI contract
        run: python scripts/check_openapi_contract.py
